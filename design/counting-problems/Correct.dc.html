<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; }
  .page {
    font-family: system-ui, Avenir, Helvetica, Arial, sans-serif;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.25rem;
  }
  .stack { width: 100%; max-width: 25rem; }
  .progress {
    font-size: 0.85rem;
    font-weight: 600;
    opacity: 0.6;
    text-align: center;
    margin: 0 0 0.75rem;
    letter-spacing: 0.02em;
  }
  .card {
    border-radius: 1rem;
    padding: 2rem 1.75rem;
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
    text-align: center;
  }
  .badge {
    width: 3rem;
    height: 3rem;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 1rem;
  }
  .badge svg { width: 1.6rem; height: 1.6rem; }
  .headline {
    font-size: 1.2rem;
    font-weight: 700;
    margin: 0 0 1.25rem;
  }
  .balloon-cluster {
    display: flex;
    justify-content: center;
    align-items: flex-end;
    gap: 0.35rem;
    flex-wrap: wrap;
    max-width: 14rem;
    margin: 0 auto 1rem;
  }
  .balloon { width: 1.9rem; height: 2.65rem; display: block; }
  .equation {
    font-size: 1.05rem;
    font-weight: 600;
    opacity: 0.75;
    margin: 0 0 1.75rem;
  }
  button {
    border-radius: 8px;
    border: 1px solid transparent;
    padding: 0.65em 1.6em;
    font-size: 1em;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    background: #4a90d9;
    color: #ffffff;
  }
  a { color: #b45309; }
  a:hover { color: #92400e; }
</style>
</helmet>
<div class="page" style="background: {{bg.page}}; color: {{bg.text}};">
  <div class="stack">
    <p class="progress">Problem {{progressCurrent}} of {{progressTotal}}</p>
    <div class="card" style="background: {{bg.card}};">
      <div class="badge" style="background: {{bg.badge}};">
        <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 12.5 9.5 18 20 6"></path>
        </svg>
      </div>
      <p class="headline">You got it!</p>
      <div class="balloon-cluster">
        <sc-for list="{{balloons}}" as="b" hint-placeholder-count="5">
          <svg class="balloon" viewBox="0 0 40 56" aria-hidden="true">
            <ellipse cx="20" cy="22" rx="18" ry="20" fill="{{b.body}}"></ellipse>
            <ellipse cx="14" cy="14" rx="6" ry="8" fill="{{b.highlight}}" opacity="0.7"></ellipse>
            <path d="M17 41 L20 47 L23 41 Z" fill="{{b.body}}"></path>
            <line x1="20" y1="47" x2="20" y2="56" stroke="#999" stroke-width="1"></line>
          </svg>
        </sc-for>
      </div>
      <p class="equation">{{equation}}</p>
      <button type="button">Next Problem</button>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"darkMode":{"editor":"boolean","default":false,"section":"Theme"}}'>
const COLORS = {
  blue: { body: '#4a90d9', highlight: '#8fc1f0' },
  yellow: { body: '#f0b429', highlight: '#f8d878' },
};

function makeBalloons(count, color) {
  return Array.from({ length: count }, () => ({ ...COLORS[color] }));
}

class Component extends DCLogic {
  renderVals() {
    const dark = !!this.props.darkMode;
    return {
      progressCurrent: 1,
      progressTotal: 10,
      equation: '2 + 3 = 5',
      balloons: [...makeBalloons(2, 'blue'), ...makeBalloons(3, 'yellow')],
      bg: dark
        ? { page: '#242424', text: 'rgba(255,255,255,0.87)', card: '#1a1a1a', badge: '#2f9e5b' }
        : { page: '#ffffff', text: '#213547', card: '#ffffff', badge: '#2f9e5b' },
    };
  }
}
</script>
</body>
</html>
